name: Go

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Go checks
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'self-hosted' && '["self-hosted","linux"]' || '["ubuntu-24.04"]') }}
    env:
      CGO_ENABLED: "0"
    steps:
      # Until the extraction (T-B2) lands there is no Go module here; the
      # workflow is committed ahead of it so the first extracted push is
      # checked. Every Go step is skipped while go.mod is absent.
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect the Go module
        id: mod
        run: echo "present=$([ -f go.mod ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Report runner disk capacity
        working-directory: ${{ github.workspace }}
        run: |
          echo "::group::Runner filesystem capacity"
          df -hP "$RUNNER_TEMP" "$GITHUB_WORKSPACE" "$HOME"
          df -iP "$RUNNER_TEMP" "$GITHUB_WORKSPACE" "$HOME"
          echo "If free blocks or inodes are low, reclaim runner capacity before retrying this workload."
          echo "::endgroup::"

      - name: Set up Go
        if: steps.mod.outputs.present == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
          cache-dependency-path: go.mod

      - name: gofmt
        if: steps.mod.outputs.present == 'true'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: go vet
        if: steps.mod.outputs.present == 'true'
        run: go vet ./...

      - name: go test
        if: steps.mod.outputs.present == 'true'
        run: go test ./...

      # The Go engine generates the corpus. This fails when a golden and the
      # engine disagree, so neither can change without the other.
      - name: conformance check
        if: steps.mod.outputs.present == 'true'
        run: go run ./cmd/conformance check

      - name: Build heisentick binary
        if: steps.mod.outputs.present == 'true'
        run: go build -trimpath -o cmd/heisentick/heisentick ./cmd/heisentick

      - name: Build WASM targets
        if: steps.mod.outputs.present == 'true'
        run: |
          GOOS=js GOARCH=wasm go build -trimpath -o cmd/dslwasm/dslwasm.wasm ./cmd/dslwasm
          GOOS=js GOARCH=wasm go build -trimpath -o cmd/enginewasm/enginewasm.wasm ./cmd/enginewasm

      - name: Set up Node for dedicated runtime parity
        if: steps.mod.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Master native/WASM synthetic report parity
        id: master_parity
        if: steps.mod.outputs.present == 'true'
        run: node scripts/checks/master-runtime-parity.mjs cmd/heisentick/heisentick cmd/enginewasm/enginewasm.wasm "$(go env GOROOT)/misc/wasm/wasm_exec.js"

      # Diagnostic only: a passing experiment never clears ordinary parity.
      # qn is an internal Go 1.22.12 compiler control, not a release profile.
      - name: Diagnose ARM64 implicit FMA on fixed synthetic cases
        if: failure() && steps.master_parity.outcome == 'failure' && runner.arch == 'ARM64'
        timeout-minutes: 5
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOSUMDB: "off"
          GOMAXPROCS: "2"
          GOMEMLIMIT: 512MiB
        run: |
          test "$(go env GOVERSION)" = "go1.22.12"
          test "$(go env GOHOSTARCH)" = "arm64"
          test "$(go env GOARCH)" = "arm64"
          test "$(go env GOOS)" = "linux"
          test "$(go env GOHOSTOS)" = "linux"
          test -z "$(go env GOFLAGS)"
          test -z "${GOCOMPILEDEBUG:-}"
          command -v timeout
          diagnostic_dir="$(mktemp -d "$RUNNER_TEMP/master-fma-XXXXXX")"
          cleanup() {
            status=$?
            trap - EXIT
            if [ -f "$diagnostic_dir/ordinary.sha256" ]; then
              sha256sum -c "$diagnostic_dir/ordinary.sha256" || status=1
            fi
            rm -rf "$diagnostic_dir"
            exit "$status"
          }
          trap cleanup EXIT
          sha256sum cmd/heisentick/heisentick cmd/dslwasm/dslwasm.wasm cmd/enginewasm/enginewasm.wasm > "$diagnostic_dir/ordinary.sha256"
          mkdir "$diagnostic_dir/tmp"
          export GOCACHE="$diagnostic_dir/go-cache" GOTMPDIR="$diagnostic_dir/tmp"
          go version -m cmd/heisentick/heisentick > "$diagnostic_dir/ordinary.buildinfo"
          head -n 1 "$diagnostic_dir/ordinary.buildinfo" | grep -E ': go1[.]22[.]12$'
          grep -E '[[:space:]]GOARCH=arm64$' "$diagnostic_dir/ordinary.buildinfo"
          grep -E '[[:space:]]GOOS=linux$' "$diagnostic_dir/ordinary.buildinfo"
          go tool objdump -s 'github.com/spik3r/heisentick-strat/engine/(master|regime)\.' cmd/heisentick/heisentick > "$diagnostic_dir/ordinary.asm"
          grep -m 20 -E 'F(MADD|MSUB|NMADD|NMSUB)' "$diagnostic_dir/ordinary.asm"
          echo "Diagnostic-only native build: Go 1.22.12 ARM64, -gcflags=all=-d=fmahash=qn"
          timeout --kill-after=5s 180s go build -mod=readonly -p=2 -trimpath -gcflags=all=-d=fmahash=qn -o "$diagnostic_dir/heisentick-no-implicit-fma" ./cmd/heisentick
          go tool objdump -s 'github.com/spik3r/heisentick-strat/engine/(master|regime)\.' "$diagnostic_dir/heisentick-no-implicit-fma" > "$diagnostic_dir/engine.asm"
          test -s "$diagnostic_dir/engine.asm"
          for symbol in master.Run regime.wma regime.rma regime.calculate; do
            grep -F "TEXT github.com/spik3r/heisentick-strat/engine/$symbol(SB)" "$diagnostic_dir/ordinary.asm"
            grep -F "TEXT github.com/spik3r/heisentick-strat/engine/$symbol(SB)" "$diagnostic_dir/engine.asm"
          done
          if grep -E 'F(MADD|MSUB|NMADD|NMSUB)' "$diagnostic_dir/engine.asm"; then
            echo "Diagnostic build still contains fused engine instructions"
            exit 1
          fi
          echo "Comparing the same fixed synthetic cases with unchanged WASM; ordinary parity remains failed"
          parity_status=0
          timeout --kill-after=5s 90s node scripts/checks/master-runtime-parity.mjs "$diagnostic_dir/heisentick-no-implicit-fma" cmd/enginewasm/enginewasm.wasm "$(go env GOROOT)/misc/wasm/wasm_exec.js" || parity_status=$?
          exit "$parity_status"

      - name: Upload heisentick artifact
        if: steps.mod.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: heisentick-${{ runner.os }}-${{ runner.arch }}
          path: cmd/heisentick/heisentick
          if-no-files-found: error

      - name: Upload WASM artifacts
        if: steps.mod.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: |
            cmd/dslwasm/dslwasm.wasm
            cmd/enginewasm/enginewasm.wasm
          if-no-files-found: error

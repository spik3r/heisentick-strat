name: Go

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Go checks
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'self-hosted' && '["self-hosted","linux"]' || '["ubuntu-24.04"]') }}
    env:
      CGO_ENABLED: "0"
    steps:
      # Until the extraction (T-B2) lands there is no Go module here; the
      # workflow is committed ahead of it so the first extracted push is
      # checked. Every Go step is skipped while go.mod is absent.
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect the Go module
        id: mod
        run: echo "present=$([ -f go.mod ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Report runner disk capacity
        working-directory: ${{ github.workspace }}
        run: |
          echo "::group::Runner filesystem capacity"
          df -hP "$RUNNER_TEMP" "$GITHUB_WORKSPACE" "$HOME"
          df -iP "$RUNNER_TEMP" "$GITHUB_WORKSPACE" "$HOME"
          for path in "$RUNNER_TEMP" "$GITHUB_WORKSPACE" "$HOME"; do
            available_kib="$(df -Pk "$path" | awk 'NR == 2 { print $4 }')"
            available_inodes="$(df -Pi "$path" | awk 'NR == 2 { print $4 }')"
            case "$available_kib:$available_inodes" in
              *[!0-9:]*|:*|*:) echo "::error::Cannot verify runner capacity for $path"; exit 1 ;;
            esac
            if [ "$available_kib" -lt 1048576 ] || [ "$available_inodes" -lt 10000 ]; then
              echo "::error::Insufficient runner capacity at $path: require at least 1 GiB free and 10000 free inodes. No cleanup was performed."
              exit 1
            fi
          done
          echo "::endgroup::"

      - name: Set up Go
        if: steps.mod.outputs.present == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
          cache-dependency-path: go.mod

      - name: gofmt
        if: steps.mod.outputs.present == 'true'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: go vet
        if: steps.mod.outputs.present == 'true'
        run: go vet ./...

      - name: go test
        if: steps.mod.outputs.present == 'true'
        run: go test ./...

      # The Go engine generates the corpus. This fails when a golden and the
      # engine disagree, so neither can change without the other.
      - name: conformance check
        if: steps.mod.outputs.present == 'true'
        run: go run ./cmd/conformance check

      - name: Build heisentick binary
        if: steps.mod.outputs.present == 'true'
        run: go build -trimpath -o cmd/heisentick/heisentick ./cmd/heisentick

      - name: Build WASM targets
        if: steps.mod.outputs.present == 'true'
        run: |
          GOOS=js GOARCH=wasm go build -trimpath -o cmd/dslwasm/dslwasm.wasm ./cmd/dslwasm
          GOOS=js GOARCH=wasm go build -trimpath -o cmd/enginewasm/enginewasm.wasm ./cmd/enginewasm

      - name: Set up Node for dedicated runtime parity
        if: steps.mod.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Release packaging and publication guard regression
        if: steps.mod.outputs.present == 'true'
        run: node --test scripts/checks/release-packaging.test.mjs

      - name: Down-shock source native report and WASM parity
        if: steps.mod.outputs.present == 'true'
        run: |
          native_engine="$(mktemp "$RUNNER_TEMP/down-shock-engine.XXXXXX")"
          trap 'rm -f "$native_engine"' EXIT
          go build -trimpath -o "$native_engine" ./cmd/enginewasm
          node scripts/checks/down-shock-source-parity.mjs cmd/heisentick/heisentick "$native_engine" cmd/enginewasm/enginewasm.wasm "$(go env GOROOT)/misc/wasm/wasm_exec.js"
          GOOS=js GOARCH=wasm go test -exec="$(go env GOROOT)/misc/wasm/go_js_wasm_exec" -run '^TestDownShock' ./engine ./report ./cmd/heisentick

      - name: Legacy Setup-9 native/WASM oracle parity
        if: steps.mod.outputs.present == 'true'
        run: |
          native_dir="$(mktemp -d "$RUNNER_TEMP/legacy-setup9.XXXXXX")"
          trap 'rm -rf "$native_dir"' EXIT
          go build -trimpath -o "$native_dir/engine" ./cmd/enginewasm
          go build -trimpath -o "$native_dir/dsl" ./cmd/dslwasm
          node scripts/checks/legacy-setup9-parity.mjs "$native_dir/engine" cmd/enginewasm/enginewasm.wasm "$native_dir/dsl" cmd/dslwasm/dslwasm.wasm "$(go env GOROOT)/misc/wasm/wasm_exec.js"

      - name: Master portable native/WASM frozen synthetic report parity
        id: master_parity
        if: steps.mod.outputs.present == 'true'
        run: node scripts/checks/master-runtime-parity.mjs cmd/heisentick/heisentick cmd/enginewasm/enginewasm.wasm "$(go env GOROOT)/misc/wasm/wasm_exec.js"

      # HT-229 partial qualification: unchanged synthetic core and fixture suite.
      # This runs a Go test binary in Node; it does not export a trading API or
      # establish browser/full-policy/release support.
      - name: Synthetic Sequential core under Node-hosted Go WASM
        if: steps.mod.outputs.present == 'true'
        timeout-minutes: 3
        run: GOOS=js GOARCH=wasm go test -count=1 -exec="$(go env GOROOT)/misc/wasm/go_js_wasm_exec" ./engine/seqcore

      # Synthetic E1/E2 execution and strict existing-bridge admission only.
      # No historical, browser, consumer or release qualification is implied.
      - name: Synthetic Sequential E1/E2 under Node-hosted Go WASM
        if: steps.mod.outputs.present == 'true'
        timeout-minutes: 3
        run: GOOS=js GOARCH=wasm go test -count=1 -exec="$(go env GOROOT)/misc/wasm/go_js_wasm_exec" -run '^TestSequential(Full|IndependentAcceptance|AcceptanceAdapterGuards)' ./dsl ./engine ./cmd/enginewasm

      - name: Sequential companion actual native and Node-WASM export parity
        id: sequential_parity
        if: steps.mod.outputs.present == 'true'
        timeout-minutes: 5
        run: |
          baseline_dir="$(mktemp -d "$RUNNER_TEMP/sequential-baseline.XXXXXX")"
          trap 'rm -rf "$baseline_dir"' EXIT
          baseline_commit=f8aba9ef13e22ace21ce31f2ed06cd86ad53464d
          git fetch --depth=1 origin "$baseline_commit"
          test "$(git rev-parse FETCH_HEAD)" = "$baseline_commit"
          test "$(git rev-parse "$baseline_commit^{tree}")" = 8e4ef994a636f2125bab2bb909c28fca5db2351d
          git archive "$baseline_commit" | tar -x -C "$baseline_dir"
          diagnostic_dir="$RUNNER_TEMP/sequential-diagnostics-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          node scripts/checks/sequential-backtest-parity.mjs --baseline-repo "$baseline_dir" --out "$diagnostic_dir"

      - name: Upload Sequential synthetic qualification diagnostics
        if: always() && (steps.sequential_parity.outcome == 'success' || steps.sequential_parity.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: sequential-diagnostics-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sequential-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 3

      - name: Run portable arithmetic kernels under Go WASM
        if: steps.mod.outputs.present == 'true'
        timeout-minutes: 3
        run: GOOS=js GOARCH=wasm go test -exec="$(go env GOROOT)/misc/wasm/go_js_wasm_exec" -run '^TestPortable' ./internal/float64contract ./engine/regime ./engine/master

      - name: Adaptive baseline raw native/WASM qualification
        if: steps.mod.outputs.present == 'true'
        run: |
          node --test scripts/checks/adaptive-runtime-receipt.test.mjs
          receipt_dir="$RUNNER_TEMP/adaptive-runtime-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$receipt_dir"
          node scripts/checks/adaptive-flag-runtime-parity.mjs cmd/heisentick/heisentick cmd/enginewasm/enginewasm.wasm "$(go env GOROOT)/misc/wasm/wasm_exec.js" "$(command -v go)" "$receipt_dir/parity.json"
          node scripts/checks/adaptive-flag-runtime-transport.mjs cmd/enginewasm/enginewasm.wasm "$(go env GOROOT)/misc/wasm/wasm_exec.js" "$receipt_dir/transport.json"
          GOOS=js GOARCH=wasm go test -exec="$(go env GOROOT)/misc/wasm/go_js_wasm_exec" -run '^TestAdaptive(Numerical|Input|Indicators|Strict|Moving|Negative|Source|Arithmetic|Derived|Reference|Evaluation)' ./engine

      - name: Validate adaptive runtime qualification receipts
        id: validate_adaptive_receipts
        if: steps.mod.outputs.present == 'true'
        run: |
          receipt_dir="$RUNNER_TEMP/adaptive-runtime-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          node scripts/checks/adaptive-runtime-receipt.mjs "$receipt_dir/parity.json" "$receipt_dir/transport.json"

      - name: Upload adaptive runtime qualification receipts
        if: steps.validate_adaptive_receipts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-runtime-qualification-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/adaptive-runtime-${{ github.run_id }}-${{ github.run_attempt }}/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Adaptive unit qualification bundle and receipt regressions
        if: steps.mod.outputs.present == 'true'
        run: |
          node --test scripts/checks/adaptive-flag-unit-evidence.test.mjs scripts/checks/adaptive-unit-receipt.test.mjs
          unit_dir="$RUNNER_TEMP/adaptive-unit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$unit_dir"
          node scripts/checks/adaptive-flag-unit-evidence.mjs "$unit_dir/reference"

      - name: Adaptive unit native and WASM qualification
        if: steps.mod.outputs.present == 'true'
        run: |
          unit_dir="$RUNNER_TEMP/adaptive-unit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          node scripts/checks/adaptive-flag-unit-parity.mjs cmd/heisentick/heisentick cmd/enginewasm/enginewasm.wasm "$(go env GOROOT)/misc/wasm/wasm_exec.js" "$(command -v go)" --bundle "$unit_dir/reference" "$unit_dir/reports" "$unit_dir/parity.json"
          node scripts/checks/adaptive-flag-unit-transport.mjs cmd/enginewasm/enginewasm.wasm "$(go env GOROOT)/misc/wasm/wasm_exec.js" "$unit_dir/transport.json"
          GOOS=js GOARCH=wasm go test -exec="$(go env GOROOT)/misc/wasm/go_js_wasm_exec" ./report/adaptiveflagunit
          GOOS=js GOARCH=wasm go test -exec="$(go env GOROOT)/misc/wasm/go_js_wasm_exec" -run '^TestAdaptiveFlagUnitBridge' ./cmd/enginewasm

      - name: Validate adaptive unit qualification receipts
        id: validate_adaptive_unit_receipts
        if: steps.mod.outputs.present == 'true'
        run: |
          unit_dir="$RUNNER_TEMP/adaptive-unit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          node scripts/checks/adaptive-unit-receipt.mjs "$unit_dir/parity.json" "$unit_dir/transport.json" "$unit_dir/reports" cmd/heisentick/heisentick cmd/enginewasm/enginewasm.wasm "$(go env GOROOT)/misc/wasm/wasm_exec.js" "$(command -v go)" "$(git rev-parse HEAD)" "$(go env GOOS)-$(go env GOARCH)" > "$unit_dir/integrity.json"

      - name: Upload adaptive unit qualification receipts
        if: steps.validate_adaptive_unit_receipts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-unit-qualification-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/adaptive-unit-${{ github.run_id }}-${{ github.run_attempt }}/*.json
          if-no-files-found: error
          retention-days: 14

      # Separate pinned pre-portable source, same native compiler and host.
      # This is a regression baseline only and is never a release artifact.
      - name: Check out pinned legacy baseline
        if: steps.mod.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          ref: 38613eb8f4e8dd8afa5e68660d2f7b83937c64fb
          path: .master-legacy-baseline

      - name: Verify native legacy Master and v9 preservation
        if: steps.mod.outputs.present == 'true'
        timeout-minutes: 5
        run: |
          baseline_dir="$RUNNER_TEMP/master-legacy-baseline"
          mkdir -p "$baseline_dir"
          trap 'rm -rf "$baseline_dir" .master-legacy-baseline' EXIT
          test "$(git -C .master-legacy-baseline rev-parse HEAD)" = 38613eb8f4e8dd8afa5e68660d2f7b83937c64fb
          test -z "$(go env GOFLAGS)"
          test -z "${GOCOMPILEDEBUG:-}"
          go version
          go env GOHOSTARCH GOARCH GOOS
          (cd .master-legacy-baseline && go build -trimpath -o "$baseline_dir/heisentick" ./cmd/heisentick)
          node scripts/checks/master-portable-legacy-parity.mjs cmd/heisentick/heisentick "$baseline_dir/heisentick"

      - name: Upload heisentick artifact
        if: steps.mod.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: heisentick-${{ runner.os }}-${{ runner.arch }}
          path: cmd/heisentick/heisentick
          if-no-files-found: error

      - name: Upload WASM artifacts
        if: steps.mod.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: |
            cmd/dslwasm/dslwasm.wasm
            cmd/enginewasm/enginewasm.wasm
          if-no-files-found: error

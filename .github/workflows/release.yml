name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build release artifacts
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'self-hosted' && '["self-hosted","linux"]' || '["ubuntu-24.04"]') }}
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
          cache-dependency-path: go.mod

      - name: Build release binaries
        run: |
          GOOS=linux GOARCH=arm64 go build -trimpath -o heisentick-linux-arm64 ./cmd/heisentick
          GOOS=linux GOARCH=amd64 go build -trimpath -o heisentick-linux-amd64 ./cmd/heisentick
          GOOS=darwin GOARCH=arm64 go build -trimpath -o heisentick-darwin-arm64 ./cmd/heisentick
          GOOS=js GOARCH=wasm go build -trimpath -o dslwasm.wasm ./cmd/dslwasm
          GOOS=js GOARCH=wasm go build -trimpath -o enginewasm.wasm ./cmd/enginewasm

      # Consumers unpack this instead of importing the Go module: the corpus,
      # the semantic fixtures, the spec manifest and schemas, and the spec docs.
      - name: Build conformance archive
        run: tar czf conformance.tar.gz conformance/ spec/

      - name: Write checksums
        run: sha256sum heisentick-linux-arm64 heisentick-linux-amd64 heisentick-darwin-arm64 dslwasm.wasm enginewasm.wasm conformance.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            heisentick-linux-arm64
            heisentick-linux-amd64
            heisentick-darwin-arm64
            dslwasm.wasm
            enginewasm.wasm
            conformance.tar.gz
            SHA256SUMS

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build release artifacts
    runs-on: ${{ fromJSON(vars.CI_RUNNER_MODE == 'self-hosted' && '["self-hosted","linux"]' || '["ubuntu-24.04"]') }}
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
          cache-dependency-path: go.mod

      - name: Build heisentick binary (linux/arm64)
        run: GOOS=linux GOARCH=arm64 go build -trimpath -o heisentick-linux-arm64 ./cmd/heisentick

      - name: Build heisentick binary (darwin/arm64)
        run: GOOS=darwin GOARCH=arm64 go build -trimpath -o heisentick-darwin-arm64 ./cmd/heisentick

      - name: Build dslwasm binary (wasm)
        run: GOOS=js GOARCH=wasm go build -trimpath -o dslwasm.wasm ./cmd/dslwasm

      - name: Build conformance corpus archive
        run: tar czf conformance.tar.gz dsl-conformance/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            heisentick-linux-arm64
            heisentick-darwin-arm64
            dslwasm.wasm
            conformance.tar.gz
